<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1e3c72" />
    <title>You're offline | RJRYT</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1724;
        color: #e5edf8;
        font: 16px system-ui, sans-serif;
        text-align: center;
      }
      .wrap {
        max-width: 32rem;
        padding: 2rem;
      }
      .brand {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        background: linear-gradient(110deg, #3675d8, #f47721);
        background-clip: text;
        color: transparent;
      }
      a {
        color: #72a7ff;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">RJRYT</div>
      <h1>You're currently offline</h1>
      <p>
        The network connection is unavailable. Reconnect to the internet and try
        again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
